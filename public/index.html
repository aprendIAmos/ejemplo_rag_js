<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat RAG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    header {
      width: 100%;
      max-width: 760px;
      padding: 18px 16px 10px;
      font-size: 18px;
      font-weight: 600;
    }
    header small {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: #8a8f98;
      margin-top: 4px;
    }
    #chat {
      width: 100%;
      max-width: 760px;
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: #2b6cb0;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #1c2028;
      border: 1px solid #2a2f3a;
      border-bottom-left-radius: 4px;
    }
    .typing { color: #8a8f98; font-style: italic; }
    form {
      width: 100%;
      max-width: 760px;
      display: flex;
      gap: 8px;
      padding: 12px 16px 20px;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #2a2f3a;
      background: #171a20;
      color: #e6e6e6;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #2b6cb0; }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2b6cb0;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    Chat RAG
    <small>Respondo con la información de los documentos indexados en <code>docs/</code>.</small>
  </header>

  <div id="chat"></div>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="Escribí tu pregunta..." />
    <button id="send" type="submit">Enviar</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    // historial local (últimos 8 mensajes) para multi-turno
    const history = [];

    function addBubble(cls, text) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      input.value = "";
      send.disabled = true;
      addBubble("user", q);
      history.push({ role: "user", content: q });

      const loading = addBubble("bot", "Pensando...");
      loading.classList.add("typing");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: q, history: history.slice(0, -1) }),
        });

        const data = await res.json();

        if (!res.ok) {
          loading.textContent = "Error: " + (data.error || res.statusText);
        } else {
          loading.classList.remove("typing");
          loading.textContent = data.answer;
          history.push({ role: "assistant", content: data.answer });
          if (history.length > 8) history.splice(0, history.length - 8);
        }
      } catch (err) {
        loading.textContent = "No se pudo conectar con el servidor.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.focus();
  </script>
</body>
</html>
